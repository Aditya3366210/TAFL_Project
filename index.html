<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFG Ambiguity Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg id="gdefs" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="nt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="t-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062018"/>
      <stop offset="100%" stop-color="#031209"/>
    </linearGradient>
    <linearGradient id="sel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#281800"/>
      <stop offset="100%" stop-color="#180e00"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header>
    <h1>CFG <em>Ambiguity</em> Detector</h1>
    <span class="hbadge">Parse Tree Analysis</span>
    <div class="hspace"></div>
    <span class="hhint">Click nodes · Scroll to zoom · Drag to pan</span>
  </header>

  <div class="main">
    <div class="ipanel">
      <div>
        <label class="flabel"><span class="fdot fdot-b"></span>Grammar Rules</label>
        <textarea id="grammar-input" rows="6" placeholder="S → S+S | SS | a&#10;&#10;One rule per line.&#10;| separates alternatives.&#10;Uppercase = non-terminal.&#10;Lowercase/symbols = terminal."></textarea>
      </div>
      <div>
        <label class="flabel"><span class="fdot fdot-g"></span>Input String <span style="color:var(--td);font-weight:400">(max 12)</span></label>
        <input type="text" id="string-input" placeholder="e.g., a+aa" maxlength="12">
      </div>
      <div class="row">
        <div class="col">
          <label class="flabel">Max Trees</label>
          <select id="max-trees">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="col">
          <label class="flabel">Max Depth</label>
          <select id="max-depth">
            <option value="8">8</option>
            <option value="12" selected>12</option>
            <option value="16">16</option>
          </select>
        </div>
      </div>
      <button class="runbtn" onclick="checkAmbiguity()">▶ Check Ambiguity</button>
      <div>
        <div class="shdr">Sample Grammars</div>
        <div class="slist" id="sample-list">
          <button class="sbtn" onclick="loadSample('S → S+S | SS | a', 'a+aa')">
            <span>Classic ambiguous</span><span class="stag stag-a">AMBIG</span>
          </button>
          <button class="sbtn" onclick="loadSample('E → E+E | E*E | a', 'a+a*a')">
            <span>Expression grammar</span><span class="stag stag-a">AMBIG</span>
          </button>
          <button class="sbtn" onclick="loadSample('S → aSb | ab', 'aaabbb')">
            <span>Unambiguous aⁿbⁿ</span><span class="stag stag-u">UNAMB</span>
          </button>
          <button class="sbtn" onclick="loadSample('S → aS | a', 'aaa')">
            <span>Unambiguous repetition</span><span class="stag stag-u">UNAMB</span>
          </button>
          <button class="sbtn" onclick="loadSample('S → SS | aSb | ab', 'ababab')">
            <span>Ambiguous balanced</span><span class="stag stag-a">AMBIG</span>
          </button>
        </div>
      </div>
    </div>

    <div class="rpanel" id="results-panel">
      <div class="placeholder">
        <div class="ph-icon">⊢</div>
        <p class="ph-txt">Enter a grammar and an input string, then click <strong>Check Ambiguity</strong> to enumerate parse trees.</p>
      </div>
    </div>
  </div>
</div>

<div class="nipanel" id="nipanel">
  <div>
    <div class="ni-type" id="ni-type"></div>
    <div class="ni-sym" id="ni-sym"></div>
  </div>
  <div class="nisep"></div>
  <div class="ni-glp">
    <div class="ni-lbl">Production</div>
    <div class="ni-val" id="ni-prod"></div>
  </div>
  <div class="nisep"></div>
  <div class="ni-glp">
    <div class="ni-lbl">Derives</div>
    <div class="ni-derv" id="ni-derv"></div>
  </div>
  <button class="niclose" onclick="hideNodeInfo()" title="Dismiss">✕</button>
</div>

<script src="script.js"></script>
</body>
</html>
